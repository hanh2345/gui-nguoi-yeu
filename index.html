<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hành Trình Tình Yêu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --text-color: #ffffff;
            --accent-pink: #ff4d6d;
            --bg-gradient: linear-gradient(135deg, #0f0c16 0%, #2a0816 100%);
        }

        body { font-family: 'Quicksand', sans-serif; background: var(--bg-gradient); color: var(--text-color); margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; }

        .music-btn { position: fixed; top: 20px; left: 20px; z-index: 10000; background: rgba(255, 77, 109, 0.8); width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; box-shadow: 0 0 15px rgba(255,77,109,0.5); transition: all 0.3s; opacity: 0; visibility: hidden; }
        .music-btn.show { opacity: 1; visibility: visible; }
        .music-btn.playing { animation: spinMusic 4s linear infinite; }
        @keyframes spinMusic { 100% { transform: rotate(360deg); } }
        .music-btn.muted { background: rgba(100, 100, 100, 0.8); animation: none; text-decoration: line-through; opacity: 0.7;}

        #particles-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; top: -10vh; color: #ffb3c6; opacity: 0.9; animation: fall linear infinite; text-shadow: 0 0 8px var(--accent-pink); }
        @keyframes fall { 0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg) scale(1.3); opacity: 0; } }

        .stage { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; opacity: 0; visibility: hidden; z-index: 10; transition: opacity 0.8s ease; }
        .stage.active { opacity: 1; visibility: visible; z-index: 20; }

        .next-btn { background: linear-gradient(135deg, #ff4d6d, #ff758c); color: white; padding: 12px 35px; border-radius: 30px; font-size: 1.1rem; font-weight: 600; cursor: pointer; border: none; opacity: 0; visibility: hidden; transform: translateY(20px); transition: all 0.4s ease; box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4); }
        .next-btn.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .next-btn:hover { transform: translateY(-5px) scale(1.05); }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(5px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.4s ease; }
        #lightbox.active { opacity: 1; visibility: visible; }
        #lightbox-img { width: 100vw; max-width: 1000px; height: auto; max-height: 100vh; object-fit: contain; transform: scale(0.3); opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; }
        #lightbox.active #lightbox-img { transform: scale(1); opacity: 1; }

        #password-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        #password-modal.active { opacity: 1; visibility: visible; }
        .pwd-box { background: rgba(42, 8, 22, 0.95); padding: 40px; border-radius: 16px; border: 1px solid var(--accent-pink); box-shadow: 0 0 40px rgba(255,77,109,0.3); text-align: center; transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 85%; max-width: 400px;}
        #password-modal.active .pwd-box { transform: scale(1); }
        .pwd-input { background: transparent; border: none; border-bottom: 2px solid var(--accent-pink); color: white; font-size: 1.5rem; text-align: center; padding: 10px; width: 100%; margin-bottom: 10px; outline: none; transition: border-color 0.3s; font-family: 'Quicksand', sans-serif;}
        .pwd-input:focus { border-bottom-color: white; }
        .pwd-error { color: #ffb3c6; font-size: 0.9rem; height: 20px; margin-bottom: 20px; font-style: italic; }

        #stage-1 { display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #env-wrapper { transition: transform 1s cubic-bezier(0.5, 0, 0.1, 1), opacity 0.8s ease-in; transform-origin: center center; display: flex; flex-direction: column; align-items: center; }
        #env-wrapper.zoom-out { transform: scale(8); opacity: 0; pointer-events: none; }
        .env-container { position: relative; width: 320px; height: 200px; cursor: pointer; perspective: 1000px; margin-top: 30px;}
        .env-back { position: absolute; inset: 0; background: #5c1a2e; border-radius: 6px; }
        .env-letter { position: absolute; bottom: 10px; left: 5%; width: 90%; height: 95%; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 2; border-radius: 4px; }
        .env-front { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
        .env-front::before { content:''; position: absolute; top:0; left:0; border-bottom: 100px solid transparent; border-top: 100px solid transparent; border-left: 160px solid #8e2b46; }
        .env-front::after { content:''; position: absolute; top:0; right:0; border-bottom: 100px solid transparent; border-top: 100px solid transparent; border-right: 160px solid #8e2b46; }
        .env-bottom { position: absolute; bottom: 0; left: 0; border-left: 160px solid transparent; border-right: 160px solid transparent; border-bottom: 110px solid #752038; z-index: 4; }
        .env-flap { position: absolute; top: 0; left: 0; border-left: 160px solid transparent; border-right: 160px solid transparent; border-top: 115px solid #a83858; z-index: 5; transform-origin: top; transition: transform 0.6s ease-in-out; }
        .heart-seal { position: absolute; top: 95px; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: var(--accent-pink); border-radius: 50%; z-index: 6; display: flex; justify-content: center; align-items: center; font-size: 24px; transition: opacity 0.3s; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } }
        .env-container.open .env-flap { transform: rotateX(180deg); z-index: 1; }
        .env-container.open .heart-seal { opacity: 0; }
        .env-container.open .env-letter { transform: translateY(-80px); }

        #stage-2 { display: flex; justify-content: center; align-items: center; flex-direction: column; perspective: 1500px; }
        .book-anim-container { transform: translateY(100vh); opacity: 0; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease-out; display: flex; justify-content: center; width: 100%; }
        .book-anim-container.slide-in { transform: translateY(0); opacity: 1; }
        .book-wrapper { position: relative; width: 320px; height: 420px; transition: transform 0.5s; margin-top: 20px; }
        .page { position: absolute; top: 0; right: 0; width: 100%; height: 100%; transform-style: preserve-3d; transform-origin: left center; transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1); cursor: pointer; }
        .page.flipped { transform: rotateY(-180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: #fff; border-radius: 4px 12px 12px 4px; box-shadow: inset 5px 0 20px rgba(0,0,0,0.1), 2px 5px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;}
        .back { transform: rotateY(180deg); border-radius: 12px 4px 4px 12px; box-shadow: inset -5px 0 20px rgba(0,0,0,0.1), -2px 5px 15px rgba(0,0,0,0.2); }
        .page-img { width: 100%; height: 220px; object-fit: cover; border: 2px solid #eee; border-radius: 4px; margin-bottom: 15px; background: #f9f9f9;}
        .page-caption { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: #333; text-align: center; }
        .page-hint { font-size: 0.8rem; color: #888; position: absolute; bottom: 15px; font-style: italic; }
        @media (min-width: 768px) { .book-wrapper.is-open { transform: translateX(50%); } .book-wrapper { width: 400px; height: 500px; } .page-img { height: 280px; } }

        #stage-3 { display: flex; justify-content: center; align-items: center; }
        #webgl-container { width: 100%; height: 100%; position: absolute; z-index: 21; cursor: grab; }
        #webgl-container:active { cursor: grabbing; }
        
        #stage-4 { display: flex; flex-direction: column; justify-content: center; position: relative;}
        .marquee-container { height: 100vh; display: flex; flex-direction: column; justify-content: space-evenly; z-index: 21;}
        .marquee-wrapper { display: flex; width: 200%; position: relative; }
        .marquee-content { display: flex; width: 50%; justify-content: space-around; }
        .marquee-content img { width: 180px; height: 180px; object-fit: cover; border-radius: 12px; border: 3px solid #fff; cursor: pointer; transition: transform 0.3s; background: #333;}
        .marquee-content img:hover { transform: scale(1.15); border-color: var(--accent-pink); z-index: 30;}
        .scroll-left .marquee-content { animation: scrollLeft linear infinite; }
        .scroll-right .marquee-content { animation: scrollRight linear infinite; }
        @keyframes scrollLeft { to { transform: translateX(-100%); } }
        @keyframes scrollRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .bottom-right-btn { position: absolute; bottom: 30px; right: 30px; z-index: 50; }

        #stage-5 { display: flex; justify-content: center; align-items: center; }
        .heart-wrapper { position: relative; width: 100vmin; height: 100vmin; max-width: 700px; max-height: 700px; display: flex; justify-content: center; align-items: center; }
        .particle-heart-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; animation: beatingHeart 1.2s infinite cubic-bezier(0.215, 0.610, 0.355, 1); filter: drop-shadow(0 0 15px rgba(255, 77, 109, 0.6)); }
        .final-box { position: relative; z-index: 2; text-align: center; padding: 30px; width: 75%; background: radial-gradient(circle, rgba(15, 12, 22, 0.7) 0%, rgba(15, 12, 22, 0) 80%); }
        @keyframes beatingHeart { 0% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop src="ngan-nam-anh-sang.mp3"></audio>
    <div id="music-btn" class="music-btn" onclick="toggleMusic()">🎵</div>
    <div id="particles-container"></div>
    <div id="lightbox" onclick="closeLightbox(event)"><img id="lightbox-img" src="" alt="Zoomed"></div>

    <div id="password-modal">
        <div class="pwd-box">
            <h3 class="text-4xl mb-6 drop-shadow-md" style="color: var(--accent-pink); font-family: 'Dancing Script', cursive;">Mật khẩu là gì nhỉ?</h3>
            <input type="password" id="pwd-input" class="pwd-input" placeholder="Nhập vào đây..." autocomplete="off">
            <div id="pwd-error" class="pwd-error"></div>
            <button class="next-btn show !translate-y-0" onclick="checkPassword()" style="margin: 0 auto; display: block;">Mở thư</button>
        </div>
    </div>

    <div id="stage-1" class="stage active">
        <div id="env-wrapper">
            <h1 class="text-5xl mb-2 text-center" style="color: var(--accent-pink); font-family: 'Dancing Script', cursive;">Mở ra nhé...</h1>
            <p class="text-gray-300 italic mb-4">Click vào phong bì để bắt đầu.</p>
            <div class="env-container" id="envelope" onclick="requirePassword()">
                <div class="env-back"></div>
                <div class="env-letter"><h2 style="font-family: 'Dancing Script', cursive; font-size: 2rem; color: #ff4d6d; margin:0;">Gửi Em</h2></div>
                <div class="env-front"></div>
                <div class="env-bottom"></div>
                <div class="env-flap"></div>
                <div class="heart-seal">♥</div>
            </div>
        </div>
    </div>

    <div id="stage-2" class="stage">
        <h2 class="text-4xl text-center mt-6 drop-shadow-lg" style="font-family: 'Dancing Script', cursive; color: var(--accent-pink); z-index: 30; position:relative;">Cuốn Sách Kỷ Niệm</h2>
        <div id="book-anim-container" class="book-anim-container">
            <div class="book-wrapper" id="book"></div>
        </div>
        <div class="text-center mt-10 z-30 position-relative">
            <button id="btn-next-2" class="next-btn" onclick="goToStage(3)">Ngắm Khối Cầu Kỷ Niệm ➔</button>
        </div>
    </div>

    <div id="stage-3" class="stage">
        <div id="webgl-container"></div>
        <div class="absolute bottom-10 w-full text-center z-30 pointer-events-none">
            <p class="text-white text-lg mb-4 shadow-black drop-shadow-xl italic px-4">Vuốt để xoay. Cuộn/Chụm 2 ngón tay để phóng to/thu nhỏ.</p>
            <button id="btn-next-3" class="next-btn pointer-events-auto" onclick="goToStage(4)">Dòng chảy thời gian ➔</button>
        </div>
    </div>

    <div id="stage-4" class="stage">
        <div class="marquee-container">
            <div class="marquee-wrapper scroll-left" id="marquee-row-1"><div class="marquee-content" style="animation-duration: 25s;"></div><div class="marquee-content" style="animation-duration: 25s;"></div></div>
            <div class="marquee-wrapper scroll-right" id="marquee-row-2"><div class="marquee-content" style="animation-duration: 35s;"></div><div class="marquee-content" style="animation-duration: 35s;"></div></div>
            <div class="marquee-wrapper scroll-left" id="marquee-row-3"><div class="marquee-content" style="animation-duration: 45s;"></div><div class="marquee-content" style="animation-duration: 45s;"></div></div>
        </div>
        <button class="next-btn show bottom-right-btn" onclick="goToStage(5)">Điều cuối cùng... ➔</button>
    </div>

    <div id="stage-5" class="stage">
        <div class="heart-wrapper">
            <canvas id="heartCanvas" width="800" height="800" class="particle-heart-canvas"></canvas>
            <div class="final-box">
                <h1 class="text-5xl mb-4" style="color: var(--accent-pink); font-family: 'Dancing Script', cursive; text-shadow: 0 4px 10px rgba(0,0,0,0.8);">Mãi Yêu Em</h1>
                <p class="text-gray-100 mb-6 text-lg font-medium drop-shadow-md">Dòng thời gian cứ trôi, nhưng kỷ niệm và tình yêu của chúng ta sẽ luôn đong đầy và còn mãi.</p>
                <button class="next-btn show" style="background:transparent; border:2px solid #ff4d6d; color:#ff4d6d" onclick="location.reload()">Xem lại từ đầu</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CẤU HÌNH THUẬT TOÁN XÁO TRỘN ẢNH (SHUFFLE ALGORITHM)
        // ==========================================
        const TOTAL_IMAGES = 90; // Sửa tổng số ảnh thành 90
        let shuffledImages = [];

        // Tạo danh sách từ 1 đến 90
        for (let i = 1; i <= TOTAL_IMAGES; i++) {
            shuffledImages.push(i);
        }

        // Xáo trộn mảng (Fisher-Yates Shuffle)
        for (let i = shuffledImages.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledImages[i], shuffledImages[j]] = [shuffledImages[j], shuffledImages[i]];
        }

        function getImg(id) { 
            // id % TOTAL_IMAGES đảm bảo khi gọi quá 90 lần, nó sẽ lặp lại mảng xáo trộn từ đầu
            const imgNumber = shuffledImages[id % TOTAL_IMAGES];
            return `images/1 (${imgNumber}).jpg`; 
        }
        // ==========================================

        function initParticles() {
            const container = document.getElementById('particles-container');
            const symbols = ['♥', '✧', '★', '。'];
            for(let i=0; i<80; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.fontSize = (Math.random() * 15 + 10) + 'px';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = '-' + (Math.random() * 15) + 's'; 
                if(p.textContent === '♥') p.style.color = '#ff4d6d';
                container.appendChild(p);
            }
        }
        initParticles();

        function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.add('active'); }
        function closeLightbox(e) { if(e.target.id === 'lightbox' || e.target.tagName === 'IMG') { document.getElementById('lightbox').classList.remove('active'); } }

        function goToStage(num) {
            document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
            document.getElementById(`stage-${num}`).classList.add('active');
            if(num === 2) initStage2(); if(num === 3) initStage3();
            if(num === 4) initStage4(); if(num === 5) initStage5();
        }

        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;
        function toggleMusic() {
            if (isPlaying) { audio.pause(); musicBtn.classList.remove('playing'); musicBtn.classList.add('muted'); } 
            else { audio.play(); musicBtn.classList.add('playing'); musicBtn.classList.remove('muted'); }
            isPlaying = !isPlaying;
        }

        let isEnvOpen = false;
        function requirePassword() {
            if(isEnvOpen) return;
            document.getElementById('password-modal').classList.add('active'); document.getElementById('pwd-input').focus();
        }
        document.getElementById('pwd-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPassword(); });

        function checkPassword() {
            const input = document.getElementById('pwd-input').value.trim();
            const errorMsg = document.getElementById('pwd-error');
            const CORRECT_PASSWORD = "1210"; 
            
            if (input === CORRECT_PASSWORD) {
                document.getElementById('password-modal').classList.remove('active');
                audio.play().then(() => { isPlaying = true; musicBtn.classList.add('show', 'playing'); }).catch(e => console.log("Audio play blocked", e));
                openEnvelope();
            } else {
                errorMsg.innerText = "Sai rồi ngốc ạ! Thử lại xem nào."; document.getElementById('pwd-input').value = "";
            }
        }

        function openEnvelope() {
            isEnvOpen = true; document.getElementById('envelope').classList.add('open');
            setTimeout(() => { document.getElementById('env-wrapper').classList.add('zoom-out'); setTimeout(() => goToStage(2), 700); }, 400);
        }

        let stage2Inited = false; let currentPage = 0; const totalPages = 6; 
        function initStage2() {
            if(stage2Inited) return; stage2Inited = true;
            const book = document.getElementById('book');
            for(let i = 0; i < totalPages; i++) {
                const page = document.createElement('div'); page.className = 'page'; page.style.zIndex = totalPages - i;
                const frontSrc = getImg(i*2); const backSrc = getImg(i*2 + 1);
                
                let capFront = i === 0 ? "Trang Bìa" : (i === totalPages - 1 ? "Kỷ niệm 10" : `Kỷ niệm ${i*2}`);
                let capBack = i === totalPages - 1 ? "Bìa Sau" : `Kỷ niệm ${i*2 + 1}`;

                page.innerHTML = `
                    <div class="front" onclick="flipPage(${i}, true)">
                        <img src="${frontSrc}" class="page-img" onerror="this.onerror=null; this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                        <div class="page-caption">${capFront}</div><div class="page-hint">Nhấp để lật ➔</div>
                    </div>
                    <div class="back" onclick="flipPage(${i}, false)">
                        <img src="${backSrc}" class="page-img" onerror="this.onerror=null; this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                        <div class="page-caption">${capBack}</div><div class="page-hint"> ⬅ Nhấp để quay lại</div>
                    </div>`;
                book.appendChild(page);
            }
            const pages = document.querySelectorAll('.page');
            if(pages.length > 0) {
                book.classList.add('is-open'); pages[0].style.transition = 'none'; pages[0].classList.add('flipped');
                pages[0].style.zIndex = 1; currentPage = 1; setTimeout(() => { pages[0].style.transition = ''; }, 100);
            }
            setTimeout(() => { document.getElementById('book-anim-container').classList.add('slide-in'); }, 100);
        }

        function flipPage(index, forward) {
            if (!forward && index === 0) return; if (forward && index === totalPages - 1) return;
            const pages = document.querySelectorAll('.page'); const bookWrap = document.getElementById('book');
            
            if(forward) {
                pages[index].classList.add('flipped'); 
                setTimeout(() => { pages[index].style.zIndex = index + 1; }, 350); 
                currentPage++; bookWrap.classList.add('is-open'); 
                if(currentPage === totalPages - 1) document.getElementById('btn-next-2').classList.add('show');
            } else {
                pages[index].style.zIndex = totalPages - index; 
                pages[index].classList.remove('flipped'); currentPage--; 
            }
        }

        let stage3Inited = false; let camera3D;
        function initStage3() {
            if(stage3Inited) return; stage3Inited = true;
            const container = document.getElementById('webgl-container');
            const scene = new THREE.Scene(); camera3D = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100); camera3D.position.z = 6.5; 
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setSize(window.innerWidth, window.innerHeight); container.appendChild(renderer.domElement);
            const sphereGroup = new THREE.Group(); scene.add(sphereGroup); const imageMeshes = [];
            
            let imageCounter = 12; // Tiếp tục lấy ảnh từ mảng sau trang sách
            let delayTime = 0; 

            for(let i = 0; i < 16; i++) {
                const thetaStart = i * (Math.PI / 16); const thetaLength = Math.PI / 16; const thetaMid = thetaStart + thetaLength / 2;
                const N = Math.max(4, Math.round(32 * Math.sin(thetaMid))); 
                
                for(let j = 0; j < N; j++) {
                    const phiStart = j * (2 * Math.PI / N); const phiLength = 2 * Math.PI / N;
                    const geo = new THREE.SphereGeometry(3, 16, 16, phiStart, phiLength, thetaStart, thetaLength);
                    
                    const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#0f0c16'; ctx.fillRect(0,0,256,256);
                    ctx.strokeStyle = '#000000'; ctx.lineWidth = 14; ctx.strokeRect(0,0,256,256);
                    const tex = new THREE.CanvasTexture(canvas); const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }); const mesh = new THREE.Mesh(geo, mat);
                    
                    const currentImgSrc = getImg(imageCounter++);
                    mesh.userData.src = currentImgSrc; 

                    setTimeout(() => {
                        const img = new Image();
                        img.onload = () => { ctx.drawImage(img, 7, 7, 242, 242); tex.needsUpdate = true; };
                        img.onerror = () => { ctx.fillStyle = '#222'; ctx.fillRect(7, 7, 242, 242); tex.needsUpdate = true; };
                        img.src = currentImgSrc;
                    }, delayTime);
                    delayTime += 15; 

                    sphereGroup.add(mesh); imageMeshes.push(mesh);
                }
            }

            let isDragging = false; let startXY = {x: 0, y: 0}, lastXY = {x: 0, y: 0}; const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
            container.addEventListener('pointerdown', (e) => { isDragging = true; startXY = { x: e.clientX, y: e.clientY }; lastXY = { x: e.clientX, y: e.clientY }; });
            window.addEventListener('pointermove', (e) => {
                if(!isDragging || !document.getElementById('stage-3').classList.contains('active')) return;
                sphereGroup.rotation.y += (e.clientX - lastXY.x) * 0.005; sphereGroup.rotation.x += (e.clientY - lastXY.y) * 0.005; lastXY = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('pointerup', (e) => {
                isDragging = false; if (!document.getElementById('stage-3').classList.contains('active')) return;
                if(Math.hypot(e.clientX - startXY.x, e.clientY - startXY.y) < 5) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera3D); const intersects = raycaster.intersectObjects(imageMeshes);
                    if(intersects.length > 0 && intersects[0].object.userData.src) openLightbox(intersects[0].object.userData.src);
                }
            });
            window.addEventListener('wheel', (e) => {
                if (!document.getElementById('stage-3').classList.contains('active')) return;
                camera3D.position.z += e.deltaY * 0.005; camera3D.position.z = Math.max(3.5, Math.min(camera3D.position.z, 12));
            });
            let initialDistance = 0;
            window.addEventListener('touchstart', (e) => {
                if (!document.getElementById('stage-3').classList.contains('active')) return;
                if (e.touches.length === 2) initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            });
            window.addEventListener('touchmove', (e) => {
                if (!document.getElementById('stage-3').classList.contains('active')) return;
                if (e.touches.length === 2 && initialDistance > 0) {
                    let currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    camera3D.position.z += (initialDistance - currentDistance) * 0.02; camera3D.position.z = Math.max(3.5, Math.min(camera3D.position.z, 12));
                    initialDistance = currentDistance;
                }
            });
            function animate() { requestAnimationFrame(animate); if(!isDragging) sphereGroup.rotation.y += 0.001; renderer.render(scene, camera3D); } animate();
            setTimeout(() => document.getElementById('btn-next-3').classList.add('show'), 4000);
        }

        let stage4Inited = false;
        function initStage4() {
            if(stage4Inited) return; stage4Inited = true;
            let imgCount = 300; // Đặt một số bất kỳ để lấy các ảnh ngẫu nhiên tiếp theo
            for(let row=1; row<=3; row++) {
                const wrapper = document.getElementById(`marquee-row-${row}`); const contents = wrapper.querySelectorAll('.marquee-content'); let imgs = '';
                for(let i=0; i<8; i++) { 
                    const src = getImg(imgCount++); 
                    imgs += `<img src="${src}" onclick="openLightbox('${src}')" onerror="this.style.display='none'">`; 
                }
                contents[0].innerHTML = imgs; contents[1].innerHTML = imgs;
            }
        }

        let stage5Inited = false;
        function initStage5() {
            if (stage5Inited) return; stage5Inited = true;
            const canvas = document.getElementById('heartCanvas'); const ctx = canvas.getContext('2d'); const particles = [];
            for(let i = 0; i < 700; i++) {
                let t = Math.PI * 2 * Math.random(); let r = Math.sqrt(Math.random()); if (Math.random() > 0.4) r = 1 - (Math.random() * 0.1); 
                let hx = 16 * Math.pow(Math.sin(t), 3); let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                particles.push({ x: hx * r, y: -hy * r, size: Math.random() * 2 + 1, angle: Math.random() * Math.PI * 2, speed: Math.random() * 0.02 + 0.01, color: Math.random() > 0.3 ? '#ff4d6d' : '#ffb3c6' });
            }
            function drawHeart() {
                if(!document.getElementById('stage-5').classList.contains('active')) { requestAnimationFrame(drawHeart); return; }
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save(); ctx.translate(canvas.width/2, canvas.height/2 - 50); let scaleFactor = 22; 
                particles.forEach(p => {
                    p.angle += p.speed; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc((p.x + Math.cos(p.angle)) * scaleFactor, (p.y + Math.sin(p.angle)) * scaleFactor, p.size, 0, Math.PI*2); ctx.fill();
                });
                ctx.restore(); requestAnimationFrame(drawHeart);
            }
            drawHeart();
        }
    </script>
</body>
</html>
